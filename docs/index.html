<!doctype html>
<html>
	<head>
		<meta name='viewport' content='width=device-width, initial-scale=1'>
		<title>Rick Roll Me!</title>
		<link
			href='./styles.css'
			rel='stylesheet'
		>
	</head>
	<body>
		<main>
			<svg id='main-visual' aria-hidden='true'></svg>
			<audio
				id='main-audio'
				aria-label='Audio player'
				onplay='RickRoll()'
				controls
			>
				<source
					src='./data/rick-roll.mp3'
					type='audio/mp3'
				/>
				This browser does not support the HTML5 audio element.
			</audio>
			<h1>Rick Roll Me!<span class='title-shadows' data-text='Rick Roll Me!' aria-hidden='true'></span></h1>
		</main>

		<script src='https://d3js.org/d3.v4.min.js'></script>
		<script src='./script.js'></script>
	</body>
</html>
